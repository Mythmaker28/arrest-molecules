name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Data_Package_FAIR2/requirements.txt
    - name: Run script to check for errors
      run: python Data_Package_FAIR2/Python_Code_API_Monte_Carlo.py --all --no_plot
    - name: Run unit tests
      run: |
        cd Data_Package_FAIR2
        python -m unittest test_api_calculations.py
